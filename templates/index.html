<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Expense Tracker</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; }
    form { display: flex; gap: .5rem; flex-wrap: wrap; margin-bottom: 1.5rem; }
    input { padding: .4rem; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: .5rem; border-bottom: 1px solid #ddd; }
  </style>
</head>
<body>
  <h1>Expense Tracker</h1>

  <form id="form">
    <input name="description" placeholder="Description" required>
    <input name="amount" type="number" step="0.01" min="0.01" placeholder="Amount" required>
    <input name="category" placeholder="Category" required>
    <input name="spent_on" type="date" required>
    <button type="submit">Add</button>
  </form>

  <table>
    <thead>
      <tr><th>Date</th><th>Description</th><th>Category</th><th>Amount</th><th></th></tr>
    </thead>
    <tbody>
      {% for e in expenses %}
      <tr>
        <td>{{ e.spent_on }}</td>
        <td>{{ e.description }}</td>
        <td>{{ e.category }}</td>
        <td>{{ "%.2f"|format(e.amount) }}</td>
        <td><button class="delete" data-id="{{ e.id }}">Delete</button></td>
      </tr>
      {% else %}
      <tr><td colspan="5">No expenses yet.</td></tr>
      {% endfor %}
    </tbody>
  </table>

  <script>
    document.getElementById("form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const data = Object.fromEntries(new FormData(event.target));
      data.amount = parseFloat(data.amount);
      const res = await fetch("/api/expenses", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data),
      });
      if (res.ok) location.reload();
      else alert("Error: " + (await res.text()));
    });

    document.querySelectorAll(".delete").forEach((btn) => {
      btn.addEventListener("click", async () => {
        await fetch(`/api/expenses/${btn.dataset.id}`, { method: "DELETE" });
        location.reload();
      });
    });
  </script>
</body>
</html>
